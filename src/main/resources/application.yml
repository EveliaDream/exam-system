spring:
  application:
    name: exam-system
  profiles:
    # dev  = MySQL 8（含建表校验，默认用于日常开发）
    # prod = MySQL 8（不打印 SQL、不写演示数据，用于交付演示）
    # h2   = 内存库（零外部依赖，用于快速验证 / 无 MySQL 环境）
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8080

spring.servlet.multipart:
  # 题库 Excel 导入：单文件上限 5MB、整体请求上限 10MB
  # （默认 1MB 对含格式的 xlsx 偏小，500 行题目很容易超过）
  max-file-size: 5MB
  max-request-size: 10MB

# ===== 考试系统业务配置 =====
exam:
  jwt:
    # 生产环境务必用环境变量覆盖，且长度 >= 32 字节
    secret: ${EXAM_JWT_SECRET:exam-system-dev-secret-key-change-me-in-production}
    # token 有效期（毫秒），默认 2 小时
    expire-millis: 7200000
    header: Authorization
    prefix: "Bearer "

logging:
  level:
    root: info
    com.finalproject.examsystem: debug
