# ===== 开发环境：MySQL 8（当前默认）=====
# 使用前请确认 MySQL 已启动，且已执行建表脚本：
#   mysql -uroot -p < docs/sql/schema.sql
#
# 若要快速切回"零依赖"的内存库（不装 MySQL 也能跑），改用：
#   .\mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# 对应配置见 application-h2.yml
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/exam_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本机 MySQL 账号密码；换机器时改成自己的，或用环境变量覆盖
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:admin}
  jpa:
    hibernate:
      # validate：启动时校验实体与表结构是否一致，不自动改表。
      # 好处是"表结构漂移"会在启动阶段就暴露，而不是运行中悄悄出问题。
      # 代价：新增实体字段时要同步维护 docs/sql/schema.sql（这也正是交付要求）。
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

exam:
  seed:
    # 幂等：仅当 sys_user 表为空时才写入演示数据，重启不会重复插入
    enabled: true
